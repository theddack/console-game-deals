name: collect

# 하루 두 번 수집 → 텔레그램 브리핑 → 데이터 커밋 → GitHub Pages 배포.
# 예약 시각: KST 09:23 · 19:23 (UTC 0:23 · 10:23). GitHub Actions 예약은 몇십 분~몇 시간 늦거나 가끔 빠질 수 있다.
# 손으로 돌릴 때(workflow_dispatch) dry_run 을 켜면 텔레그램은 보내지 않고 로그에만 찍는다.
on:
  schedule:
    - cron: "23 0,10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램을 보내지 않고 메시지만 로그에 출력"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      # 일부 소스가 실패해도 나머지로 계속한다 (전부 실패할 때만 실패)
      - name: Collect
        run: python -m collector.main

      # 사이트 수정으로 돈 실행(push)에서는 알림을 보내지 않는다
      - name: Notify
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python -m collector.notify

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 수집"
            for wait in 5 15 30; do
              git pull --rebase origin main && git push && exit 0
              sleep $wait
            done
            exit 1
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp data/hotdeals.json data/games.json data/news.json _site/ 2>/dev/null || true
          # 스크립트·스타일 주소에 코드 버전을 붙인다. Pages 캐시(10분) 때문에 새 index.html 과 예전 app.js 가
          # 섞여 불러와지면 목록이 안 그려진 적이 있다 (2026-11-08)
          v=$(git log -1 --format=%h -- site/)
          sed -i "s#\"style.css\"#\"style.css?v=$v\"#; s#\"app.js\"#\"app.js?v=$v\"#" _site/index.html
          grep -o 'app.js?v=[^"]*' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
